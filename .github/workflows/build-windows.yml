name: Build Windows

on:
  push:
    branches: [ "dev", "main", "ci/windows-gha-build" ]
  pull_request:
    branches: [ "dev", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Fixer
        run: cargo build --manifest-path fixer/Cargo.toml --release --verbose

      - name: Build Cleaner
        run: cargo build --manifest-path cleaner/Cargo.toml --release --verbose

      - name: Build Compare
        run: cargo build --manifest-path compare/Cargo.toml --release --verbose

      - name: Build Runner
        run: cargo build --manifest-path runner/Cargo.toml --release --verbose

      - name: Create output directory
        run: mkdir dist

      - name: Copy binaries to dist
        run: |
          Copy-Item -Path fixer/target/release/svgfixer.exe -Destination dist/
          Copy-Item -Path cleaner/target/release/svgcleaner.exe -Destination dist/
          Copy-Item -Path compare/target/release/svgcompare.exe -Destination dist/
          Copy-Item -Path runner/target/release/svgrunner.exe -Destination dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/
          retention-days: 30
