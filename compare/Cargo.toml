[package]
name = "svgcompare"
version = "0.1.0"
authors = ["callum sykes <callum@mcneel.com"]
keywords = ["svg", "compare"]
license = "GPL-2.0"
description = "Compares SVGs by renderign to PNG and checking pixels"
documentation = "https://github.com/mcneel/svgcleaner/compare/README.md"
repository = "https://github.com/mcneel/svgcleaner"
readme = "../README.md"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
resvg = "0.45.1"
test-case = "3.3.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
